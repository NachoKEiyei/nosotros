const IMGK=['img','menuImg','photo','src'],imc={},idOf=new Map(),raw={},busy={};let rht=0;
const setImg=(id,u)=>{imc[id]=u;idOf.set(u,id)};

async function loadImg(id){if(imc[id]||busy[id])return;busy[id]=1;let d=null;
 try{d=await D.doc('imgs/'+id).get({source:'cache'})}catch(e){}
 if(!d||!d.exists){try{d=await D.doc('imgs/'+id).get()}catch(e){busy[id]=0;return}}
 if(d.exists&&d.data().d){setImg(id,d.data().d);clearTimeout(rht);rht=setTimeout(()=>{for(const n in raw)data[n]=raw[n].map(hyd);render()},80)}}
